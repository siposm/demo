<div class="container">
	<h1 class="display-1 mb-5 mt-3">Developer Database App</h1>

	<table class="table table-sm table-striped table-bordered mb-5">
		<thead>
			<tr>
				<th>name</th>
				<th>email</th>
				<th>age</th>
				<th>job</th>
				<th>salary</th>
				<th>skills</th>
			</tr>
		</thead>
		<tbody>
			<tr *ngFor="let item of apiService.developers" (click)="highlight(row)" #row>
				<td>
					<img src="{{ item.image }}" width="50" class="rounded-circle">
					{{ item.name }}
				</td>
				<td>{{ item.email }}</td>
				<td>{{ item.age }}</td>
				<td>{{ item.salary }}</td>
				<td>{{ item.job }}</td>
				<td>{{ item.skills }}</td>
			</tr>
		</tbody>
	</table>

	<app-footer></app-footer>
</div>
